name: Build and publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    name: Test and cross-compile Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Ubuntu 24.04 apt mirrors can stall silently. Start with the
          # package indexes provided by the runner image, then refresh if needed.
          packages=(gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64)
          apt_opts=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::ForceIPv4=true
          )
          if command -v x86_64-w64-mingw32-gcc >/dev/null &&
             command -v x86_64-w64-mingw32-windres >/dev/null; then
            echo "MinGW-w64 is already installed."
          elif ! timeout --signal=TERM --kill-after=5s 180s sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"; then
            echo "::warning::Initial MinGW install failed; updating apt indexes with a strict deadline."
            timeout --signal=TERM --kill-after=5s 90s sudo apt-get "${apt_opts[@]}" update
            timeout --signal=TERM --kill-after=5s 180s sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"
          fi
          command -v x86_64-w64-mingw32-gcc
          command -v x86_64-w64-mingw32-windres
      - name: Install Rust and Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt
      - name: Check tracked files for private patterns
        run: python3 scripts/privacy_scan.py
      - name: Rust tests
        run: cargo test --locked
      - name: Check Windows UI metadata and icon
        run: node tests/ui.cjs
      - name: Compile portable Windows x64 EXE
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: Package executable, documentation and checksums
        run: python3 scripts/package_release.py
      - name: Stage private draft release for Windows smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="v$version"
          asset=dist/NotionToObsidian_Windows_x64.zip
          test -s "$asset"
          test -s dist/SHA256SUMS.txt
          # Drafts do not resolve through /releases/tags/{tag}; use the list API.
          existing_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)
          if [[ -n "$existing_id" ]]; then
            is_draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$existing_id" --jq '.draft')
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Version $tag was already published; bump the version."
              exit 1
            fi
            # A failed run may have left an unpublished draft from an older SHA.
            # Remove only the draft with this exact version, never a published release.
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$existing_id"
          fi
          gh release create "$tag" "$asset" dist/SHA256SUMS.txt \
            --title "Notion → Obsidian $tag (Windows x64)" \
            --target "$GITHUB_SHA" \
            --notes "Portable Windows x64 app. Release is published after automated Windows smoke testing." \
            --draft

  smoke:
    name: Run Windows x64 conversion smoke test
    needs: build
    permissions:
      # GitHub draft releases require push-level access even for read operations.
      contents: write
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release assets by ID
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "notion-to-obsidian-smoke-test"
          }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" -Headers $headers
          $release = $releases | Where-Object { $_.tag_name -eq "v$version" -and $_.draft -eq $true } | Select-Object -First 1
          if (!$release) { throw "Draft release v$version not found in authenticated release listing" }
          New-Item -ItemType Directory -Path staged -Force | Out-Null
          $headers.Accept = "application/octet-stream"
          foreach ($name in @("NotionToObsidian_Windows_x64.zip", "SHA256SUMS.txt")) {
            $asset = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (!$asset) { throw "Missing draft release asset: $name" }
            Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -Headers $headers -OutFile "staged/$name"
          }
          $expected = ((Get-Content staged/SHA256SUMS.txt) -split '\s+')[0]
          $actual = (Get-FileHash staged/NotionToObsidian_Windows_x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Staged release ZIP checksum mismatch" }
          Expand-Archive -Path staged/NotionToObsidian_Windows_x64.zip -DestinationPath extracted -Force
      - name: Verify and run actual Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $exe = Join-Path (Resolve-Path extracted).Path "NotionToObsidian_v$version.exe"
          if (!(Test-Path $exe)) { throw "Windows executable is missing" }
          $checksum = ((Get-Content extracted/SHA256SUMS.txt) -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne $actual) { throw "EXE checksum mismatch" }
          if (Get-ChildItem extracted -Filter '*.zip' -File) { throw "Nested ZIP in artifact" }
          $fixture_script = @'
          from zipfile import ZipFile
          a = "a" * 32
          b = "b" * 32
          with ZipFile("fixture.zip", "w") as z:
              z.writestr(f"Root {a}.md", f"# Root\n\n## Раздел\n\n[Article](Root/Article%20{b}.md)")
              z.writestr(f"Root/Article {b}.md", "# Article\n\n## First\n\nFirst body\n\n## Second\n\nSecond body")
          '@
          $fixture_script | python -
          $archive = (Resolve-Path fixture.zip).Path
          $out = Join-Path (Get-Location).Path "converted"
          $process = Start-Process -FilePath $exe -ArgumentList @($archive, $out) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows converter exited with $($process.ExitCode)" }
          if (!(Test-Path "$out/.obsidian/app.json")) { throw "Obsidian settings missing at vault root" }
          if (!(Test-Path "$out/.notion-to-obsidian/migration-report.json")) { throw "Migration report missing" }
          if (Test-Path "$out/Vault") { throw "Unexpected nested Vault directory" }
          $summaries = @(Get-ChildItem -Path $out -Filter "Оглавление.md" -File -Recurse)
          if ($summaries.Count -gt 0) { throw "Generated folder summaries remain" }
          $articles = @(Get-ChildItem -Path $out -Filter "Article.md" -File -Recurse)
          if ($articles.Count -ne 1) { throw "Expected one article, found $($articles.Count)" }
          $body = Get-Content $articles[0].FullName -Raw -Encoding UTF8
          if (!$body.Contains('**Содержание**')) { throw "Article's own table of contents missing" }
          $report = Get-Content "$out/.notion-to-obsidian/migration-report.json" -Raw | ConvertFrom-Json
          if ($report.audit.passed -ne $true) { throw "Migration structural audit failed" }
          Write-Host "Windows smoke test passed: EXE runs, flat vault, in-page TOC, no folder indices"

  release:
    name: Publish tested Windows release
    if: github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="v$version"
          draft_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft == true) | .id" | head -n 1)
          if [[ -z "$draft_id" ]]; then
            echo "::error::Unpublished draft for $tag not found"
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false -f make_latest=true --jq '.html_url'
          echo "Ready-to-run download: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/NotionToObsidian_Windows_x64.zip"
