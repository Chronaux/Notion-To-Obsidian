[package]
name = "notion-to-obsidian"
version = "0.6.7"
edition = "2021"
description = "Portable offline Notion Markdown & CSV to Obsidian converter"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
csv = "1"
percent-encoding = "2"
unicode-normalization = "0.1"
html-escape = "0.2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
pulldown-cmark = "0.13"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
